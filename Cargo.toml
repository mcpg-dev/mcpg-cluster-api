[package]
name = "mcpg-cluster-api"
version = "0.1.0-beta.22"
license = "Apache-2.0"
edition = "2024"
description = """
Trait surface for the MCPG cluster backbone. Exposes two orthogonal
primitives that any cluster backend (single-node, redis, nats, …)
can implement à la carte:


  - `KeyValueStore` — durable namespaced key/value with atomic
    `put_if_absent` and `incr`
  - `PubSub` — topic-based fire-and-forget messaging

Plus the higher-level `ClusterBackend` trait that bundles the
primitives with peer discovery, leader-election and fenced-lock
semantics.

Every gateway capability (sessions, tasks, pipelines, subscriptions,
cancellation bus, delivery bus) consumes the primitives directly via
`Arc<dyn KeyValueStore>` etc.; the cluster plugin is the single source
that constructs and shares them.
"""

[dependencies]
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
futures-core = { version = "0.3", default-features = false, features = ["std"] }
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.22", version = "=0.1.0-beta.22" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
# Enable the shared contract test suite. Backends turn this on as a
# dev-dependency feature so their tests run the same battery of
# correctness checks against the trait implementation. Deliberately
# dep-free (the suite blocks the thread for its waits instead of
# pulling a runtime) so enabling it changes no dependency edge.
test-suite = []

[dev-dependencies]
serde_json = "1"
